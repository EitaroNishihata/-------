<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YORIMICHI｜好きの外側へ。</title>
<meta name="description" content="YORIMICHI — 好きの外側へ。 プロトタイプを操作できます。">
<meta property="og:title" content="YORIMICHI｜好きの外側へ。">
<meta property="og:description" content="YORIMICHI のプロトタイプ">
<meta name="theme-color" content="#f5f5f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #ffffff;
    --bg-bottom: #f3f2ee;
    --ink: #1d1d1f;
    --sub: #6e6e73;
    --bezel: #1d1d1f;
    --header-h: 88px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed;
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }

  header {
    height: var(--header-h);
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }
  h1 {
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.32em;
    padding-left: 0.32em; /* optical centering for tracking */
  }
  header p {
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.18em;
    color: var(--sub);
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-bottom: 32px;
  }

  /* Phone mockup (desktop / tablet) */
  .device {
    --h: clamp(560px, calc(100dvh - var(--header-h) - 72px), 852px);
    position: relative;
    padding: 11px;
    border-radius: 58px;
    background: var(--bezel);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.35),
      inset 0 0 0 2px rgba(255,255,255,.08),
      0 40px 80px -24px rgba(0,0,0,.28),
      0 12px 24px -12px rgba(0,0,0,.18);
  }
  /* side buttons */
  .device::before, .device::after {
    content: "";
    position: absolute;
    width: 3px;
    background: #2a2a2d;
    border-radius: 2px;
  }
  .device::before { left: -3px; top: 150px; height: 60px; box-shadow: 0 84px 0 #2a2a2d; }
  .device::after  { right: -3px; top: 190px; height: 92px; }

  .screen {
    height: var(--h);
    aspect-ratio: 393 / 852;
    border-radius: 47px;
    overflow: hidden;
    background: #fff;
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }

  /* Smartphone: near full-screen, no mockup */
  @media (max-width: 600px) {
    :root { --header-h: 64px; }
    header { gap: 3px; }
    h1 { font-size: 15px; }
    header p { font-size: 12px; }
    main { padding-bottom: 0; }
    .device {
      width: 100%;
      padding: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
    }
    .device::before, .device::after { display: none; }
    .screen {
      width: 100%;
      height: calc(100dvh - var(--header-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      aspect-ratio: auto;
      border-radius: 20px 20px 0 0;
    }
  }

  /* Short desktop windows */
  @media (min-width: 601px) and (max-height: 700px) {
    :root { --header-h: 64px; }
    .device { --h: calc(100dvh - var(--header-h) - 40px); }
  }
</style>
</head>
<body>
  <header>
    <h1>YORIMICHI</h1>
    <p>好きの外側へ。</p>
  </header>

  <main>
    <div class="device">
      <div class="screen">
        <iframe
          title="YORIMICHI プロトタイプ"
          src="https://embed.figma.com/proto/cIB6MGcDjejwQpf2YhvTkt/%E5%AE%9F%E7%BF%92-%E3%83%A1%E3%83%A2%E3%82%A2%E3%83%97%E3%83%AA?node-id=1538-348&amp;viewport=392%2C-42%2C0.07&amp;scaling=min-zoom&amp;content-scaling=fixed&amp;starting-point-node-id=1538%3A348&amp;page-id=1362%3A5953&amp;embed-host=share&amp;hide-ui=1"
          allowfullscreen></iframe>
      </div>
    </div>
  </main>
</body>
</html>
